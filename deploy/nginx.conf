# Root-path static deployment. Place this server block inside your existing
# http {} configuration, with the standard mime.types included there.
# This HTTP listener must sit behind your existing HTTPS reverse proxy.
# If serving browsers directly, configure TLS first: PWA requires HTTPS.
# Replace the server_name/root and publish the CONTENTS of dist to that root.
# For a subdirectory deployment, adjust the location prefixes accordingly.
server {
    listen 80;
    server_name resume.example.com;
    root /var/www/local-resume;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf application/wasm;
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /index.html { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires -1;
        try_files $uri =404;
    }
    # Some bundled mime.types files omit .mjs, which breaks module Workers
    # when nosniff is enabled. This regex wins over the /assets/ prefix below.
    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        try_files $uri =404;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    # Font filenames are stable across releases; revalidate them online.
    # Service Worker precaching still makes the fonts available offline.
    location /fonts/ { expires -1; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
